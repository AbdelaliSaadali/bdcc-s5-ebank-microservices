spring.application.name=gateway-service
server.port=9999

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Route 1: Customer-Service
spring.cloud.gateway.server.webflux.routes[0].id=customer-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customers,/customers/**

# Route 2: EBank-Service
spring.cloud.gateway.server.webflux.routes[1].id=ebank-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ebank-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/accounts,/accounts/**

# Customer MCP route
spring.cloud.gateway.server.webflux.routes[2].id=customer-mcp-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/customer-mcp/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# EBank MCP route
spring.cloud.gateway.server.webflux.routes[3].id=ebank-mcp-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ebank-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ebank-mcp/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# Chatbot REST route
spring.cloud.gateway.server.webflux.routes[4].id=ebank-bot-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ebank-bot
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/chat,/chat/**