spring.application.name=ebank-bot
server.port=8058

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Load the local credentials file
spring.config.import=optional:file:./local-secrets.properties

# Spring AI
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=ebank-bot-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.toolcallback.enabled=true

# Customer MCP through Gateway
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:9999
spring.ai.mcp.client.streamable-http.connections.customer.endpoint=/customer-mcp/mcp

# EBank MCP through Gateway
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:9999
spring.ai.mcp.client.streamable-http.connections.ebank.endpoint=/ebank-mcp/mcp

spring.profiles.active=dev

# Messaging platform integrations
# Disabled until the corresponding credentials are configured
ebank.bot.telegram.enabled=false
ebank.bot.discord.enabled=false